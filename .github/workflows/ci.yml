name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install C quality tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-format make

      - name: Check formatting
        run: make format-check

      - name: Run static analysis
        run: make lint

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang make

      - name: Build
        run: make

      - name: Test
        run: make test